<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>Tic-Tac-Toe</h1>
    <div id="overlay" class="overlay">
      <div><h1 id="overlay-title">Tic-Tac-Toe</h1></div>
      <div class="overlay-content">
        <h2>Enter Player Names</h2>
        <form id="player-form">
          <label for="player1">Player 1 (X):</label>
          <input
            type="text"
            id="player1"
            placeholder="Player 1 Name"
            required
          />
          <label for="player2">Player 2 (O):</label>
          <input
            type="text"
            id="player2"
            placeholder="Player 2 Name"
            required
          />
          <button id="start-game" type="submit">Start Game</button>
        </form>
      </div>
    </div>
    <div class="result" id="result">
      <h2 id="result-text">X's Turn</h2>
      <button id="restart-button">Restart</button>
    </div>
    <div id="wrapper">
      <div id="player1-score" class="score-box">
        <h2 id="player1-score-title">Player 1 Score</h2>
        <h3 id="player1-score-number" class="score-number">0</h3>
      </div>
      <div class="game-board" id="game-board">
        <div class="cell X" id="cell-1" data-cell="0"></div>
        <div class="cell O" id="cell-2" data-cell="1"></div>
        <div class="cell" id="cell-3" data-cell="2"></div>
        <div class="cell" id="cell-4" data-cell="3"></div>
        <div class="cell" id="cell-5" data-cell="4"></div>
        <div class="cell" id="cell-6" data-cell="5"></div>
        <div class="cell" id="cell-7" data-cell="6"></div>
        <div class="cell" id="cell-8" data-cell="7"></div>
        <div class="cell" id="cell-9" data-cell="8"></div>
      </div>
      <div id="player2-score" class="score-box">
        <h2 id="player2-score-title">Player 2 Score</h2>
        <h3 id="player2-score-number" class="score-number">0</h3>
      </div>
    </div>
    <div class="winning-message" id="winning-message">
      <div data-winning-text></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
